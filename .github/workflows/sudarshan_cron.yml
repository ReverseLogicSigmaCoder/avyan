name: Sudarshan Automated Multi-Target Audit

on:
  schedule:
    # Exact Daily 09:00 AM IST (03:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  daily-multi-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout AVYAN Repository
      uses: actions/checkout@v4
        with:
          persist-credentials: false
        with:
          persist-credentials: false

    - name: Set up Python Engine
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Execute Multi-Target Passive Audit
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python modules/advisory_engine.py

