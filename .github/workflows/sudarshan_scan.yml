name: SUDARSHAN Automated Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sudarshan-security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run SUDARSHAN SAST Engine
        run: |
          curl -sSL https://raw.githubusercontent.com/ReverseLogicSigmaCoder/avyan/main/sudarshan_supreme_engine.py -o sudarshan_supreme_engine.py
          python sudarshan_supreme_engine.py
